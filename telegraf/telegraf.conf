# Telegraf configuration for the wind-turbine digital twin.
# Ingests JSON telemetry published by the simulator over MQTT and writes it to InfluxDB 2.7.
#
# ENV VAR SUBSTITUTION: Telegraf natively expands ${VAR} references in this file
# at load time (no envsubst wrapper needed) — it reads the process environment,
# which docker-compose.yml populates for the `telegraf` service from `.env` via
# its `environment:` block. If a variable referenced below is unset at runtime,
# Telegraf will fail to start with a clear "environment variable not found"
# error rather than silently falling back — so all vars used here are also
# given defaults in docker-compose.yml's `environment:` block for this service.

[agent]
  interval = "${TELEGRAF_INTERVAL}"
  round_interval = true
  metric_batch_size = ${TELEGRAF_BATCH_SIZE}
  metric_buffer_limit = ${TELEGRAF_BUFFER_LIMIT}
  collection_jitter = "0s"
  flush_interval = "${TELEGRAF_FLUSH_INTERVAL}"
  flush_jitter = "0s"
  precision = ""
  hostname = ""
  omit_hostname = false

[[outputs.influxdb_v2]]
  ## The URLs of the InfluxDB cluster nodes.
  urls = ["http://${INFLUXDB_HOST}:${INFLUXDB_PORT}"]

  ## Token for authentication.
  token = "${INFLUXDB_TOKEN}"

  ## Organization is the name of the organization you wish to write to; must exist.
  organization = "${INFLUXDB_ORG}"

  ## Destination bucket to write into.
  bucket = "${INFLUXDB_BUCKET}"

[[inputs.mqtt_consumer]]
  ## Broker URLs for the MQTT server or cluster.
  servers = ["mqtt://${MQTT_BROKER}:${MQTT_PORT}"]

  ## Topics that will be subscribed to.
  topics = [
    "${MQTT_TOPIC}",
  ]

  ## Data format to consume - JSON telemetry payload published by the simulator.
  data_format = "json"
  name_override = "${TELEGRAF_MEASUREMENT}"

  ## The status field is a string enum (RUNNING/IDLE/FAULT/MAINTENANCE); keep it as a
  ## string field rather than trying to parse it as numeric.
  json_string_fields = ["status"]

  ## Use the payload's own timestamp instead of the time Telegraf received the message.
  json_time_key = "timestamp"
  json_time_format = "2006-01-02T15:04:05Z"
