# Default listener port for unencrypted connections
listener 1883 0.0.0.0

# Path to the directory where persistence information is stored.
persistence true
persistence_location /mosquitto/data/

# Log settings
log_dest file /mosquitto/log/mosquitto.log
log_type all

# Connection settings
max_connections -1

# Local-only prototype: anonymous access, no TLS.
# For a production/exposed deployment, set allow_anonymous false and add a password_file.
allow_anonymous true
