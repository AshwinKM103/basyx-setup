services:
  aas-environment:
    container_name: aas-environment
    image: eclipsebasyx/aasenvironment-go:latest
    pull_policy: always
    ports:
      - '${AAS_ENVIRONMENT_PORT:-8082}:8082'
    environment:
      - SERVER_PORT=${AAS_ENVIRONMENT_PORT:-8082}
      - CORS_ALLOWEDORIGINS=*
      - CORS_ALLOWEDHEADERS=*
      - CORS_ALLOWEDCREDENTIALS=true
      - CORS_ALLOWEDMETHODS=GET,POST,PUT,PATCH,DELETE,OPTIONS
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin123}
      - POSTGRES_DBNAME=${POSTGRES_DB:-basyxTestDB}
      - POSTGRES_MAXOPENCONNECTIONS=${POSTGRES_MAXOPENCONNECTIONS:-500}
      - POSTGRES_MAXIDLECONNECTIONS=${POSTGRES_MAXIDLECONNECTIONS:-500}
      - POSTGRES_CONNMAXLIFETIMEMINUTES=${POSTGRES_CONNMAXLIFETIMEMINUTES:-5}
      - JWS_PRIVATEKEYPATH=/app/rsa-key.pem
      - ABAC_ENABLED=false
      - GENERAL_AASREGISTRYINTEGRATION=true
      - GENERAL_SUBMODELREGISTRYINTEGRATION=true
      - GENERAL_DISCOVERYINTEGRATION=true
      - GENERAL_EXTERNALURL=${AAS_EXTERNAL_URL:-http://localhost:8082}
      - GENERAL_AAS_PRECONFIG_PATHS=/app/preconfiguration
      - LOGGING_LEVEL=debug
      - LOGGING_FORMAT=text
    volumes:
      - ./basyx/rsa-key.pem:/app/rsa-key.pem:ro
      - ./aas:/app/preconfiguration:ro
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully
    restart: unless-stopped
  db:
    container_name: postgres_db
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-basyxTestDB}
    command:
      - postgres
      - '-c'
      - listen_addresses=*
      - '-c'
      - log_statement=all
      - '-c'
      - log_min_messages=debug1
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-basyxTestDB}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  basyx_configuration:
    container_name: basyx_configuration
    image: eclipsebasyx/basyxconfigurationservice-go:latest
    pull_policy: always
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin123}
      - POSTGRES_DBNAME=${POSTGRES_DB:-basyxTestDB}
      - POSTGRES_MAXOPENCONNECTIONS=${POSTGRES_MAXOPENCONNECTIONS:-500}
      - POSTGRES_MAXIDLECONNECTIONS=${POSTGRES_MAXIDLECONNECTIONS:-500}
      - POSTGRES_CONNMAXLIFETIMEMINUTES=${POSTGRES_CONNMAXLIFETIMEMINUTES:-5}
      - LOGGING_LEVEL=debug
      - LOGGING_FORMAT=text
    depends_on:
      db:
        condition: service_healthy
  aas-ui:
    container_name: aas-web-ui
    image: eclipsebasyx/aas-gui:latest
    pull_policy: always
    ports:
      - '${AAS_GUI_PORT:-3000}:3000'
    environment:
      ENDPOINT_CONFIG_AVAILABLE: 'true'
      ALLOW_EDITING: 'true'
      ALLOW_UPLOADING: 'true'
      ALLOW_LOGOUT: 'true'
      SM_VIEWER_EDITOR: 'true'
      START_PAGE_ROUTE_NAME: AASViewer
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-T8s57FEsJmZET/m0wAIB1ELo989hUzRJg2DGIa5zBiE0u3xroDCl6GX4amg=}
    volumes:
      - ./basyx-infra.yml:/basyx-infra.yml:ro
    depends_on:
      aas-environment:
        condition: service_started
    restart: unless-stopped

  influxdb:
    container_name: influxdb
    image: influxdb:2.7
    ports:
      - '${INFLUXDB_PORT:-8086}:8086'
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-influxpassword}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-basyx}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-wind_turbine}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-T8s57FEsJmZET/m0wAIB1ELo989hUzRJg2DGIa5zBiE0u3xroDCl6GX4amg=}
      INFLUXD_LOG_LEVEL: debug
    restart: unless-stopped

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2.0.15
    ports:
      - '${MQTT_PORT:-1883}:1883'
    volumes:
      - ./mosquitto:/mosquitto
    healthcheck:
      test:
        - CMD-SHELL
        - mosquitto_sub -p ${MQTT_PORT:-1883} -t 'topic' -C 1 -E -i probe -W 3
      interval: 5s
      timeout: 10s
      start_period: 1s
      retries: 3
    restart: unless-stopped

  telegraf:
    container_name: telegraf
    image: telegraf:1.29.1
    hostname: basyx_host
    command:
      - '--config'
      - /etc/telegraf/telegraf.conf
      - '--debug'
    environment:
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-T8s57FEsJmZET/m0wAIB1ELo989hUzRJg2DGIa5zBiE0u3xroDCl6GX4amg=}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-basyx}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-wind_turbine}
      - INFLUXDB_HOST=${INFLUXDB_HOST:-influxdb}
      - INFLUXDB_PORT=${INFLUXDB_PORT:-8086}
      - TELEGRAF_MEASUREMENT=${TELEGRAF_MEASUREMENT:-wind_turbine_metric}
      - MQTT_BROKER=${MQTT_BROKER:-mosquitto}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_TOPIC=${MQTT_TOPIC:-WindTurbine/Telemetry}
      - TELEGRAF_INTERVAL=${TELEGRAF_INTERVAL:-1s}
      - TELEGRAF_FLUSH_INTERVAL=${TELEGRAF_FLUSH_INTERVAL:-10s}
      - TELEGRAF_BATCH_SIZE=${TELEGRAF_BATCH_SIZE:-1000}
      - TELEGRAF_BUFFER_LIMIT=${TELEGRAF_BUFFER_LIMIT:-10000}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - influxdb
      - mosquitto
    restart: unless-stopped

  simulator:
    container_name: wind-turbine-simulator
    build: ./simulator
    environment:
      - MQTT_BROKER=${MQTT_BROKER:-mosquitto}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_TOPIC=${MQTT_TOPIC:-WindTurbine/Telemetry}
      - SIMULATOR_INTERVAL_SECONDS=${SIMULATOR_INTERVAL_SECONDS:-1}
      - SIMULATOR_LOG_LEVEL=${SIMULATOR_LOG_LEVEL:-DEBUG}
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
